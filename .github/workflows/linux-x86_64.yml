name: Linux x86_64

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: py311
            python: "3.11"
            blender: "4.5"
          - abi: py313
            python: "3.13"
            blender: "5.2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Verify focused Linux contracts
        run: |
          python -m unittest \
            tests.test_runtime_platform \
            tests.test_optional_dependencies \
            tests.test_desktop_operations

      - name: Assemble Python runtime
        run: |
          python -m pip install numpy
          python tools/assemble_linux_python_deps.py \
            --abi "${{ matrix.abi }}" --python "$(command -v python)"

      - name: Build native modules
        run: |
          python tools/build_linux_native.py \
            --abi "${{ matrix.abi }}" \
            --python "$(command -v python)" \
            --jobs 2

      - name: Build and import Linux ZIP
        run: |
          ZIP="_dist/HoTools-Blender-${{ matrix.blender }}-Linux-x86_64.zip"
          python tools/build_release_zip.py \
            --abi "${{ matrix.abi }}" \
            --platform linux-x86_64 \
            --output "$ZIP"
          python tools/verify_release_archive.py "$ZIP" "${{ matrix.abi }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.abi }}
          path: _dist/*.zip
          compression-level: 0
