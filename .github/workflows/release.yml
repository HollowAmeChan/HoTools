name: Auto Release Install ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/linux-x86_64.yml
    permissions:
      contents: read

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows ZIPs
        run: |
          python tools/build_release_zip.py \
            --abi py311 --platform windows-x86_64 \
            --output _dist/HoTools-Blender-4.5-Windows-x86_64.zip
          python tools/build_release_zip.py \
            --abi py313 --platform windows-x86_64 \
            --output _dist/HoTools-Blender-5.2-Windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: _dist/*.zip
          compression-level: 0

  release:
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _dist
          merge-multiple: true

      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(date +'%Y%m%d-%H%M%S')"
          mv _dist/HoTools-Blender-4.5-Windows-x86_64.zip \
            "_dist/HoTools-${VERSION}-Blender-4.5-Windows-x86_64.zip"
          mv _dist/HoTools-Blender-5.2-Windows-x86_64.zip \
            "_dist/HoTools-${VERSION}-Blender-5.2-Windows-x86_64.zip"
          mv _dist/HoTools-Blender-4.5-Linux-x86_64.zip \
            "_dist/HoTools-${VERSION}-Blender-4.5-Linux-x86_64.zip"
          mv _dist/HoTools-Blender-5.2-Linux-x86_64.zip \
            "_dist/HoTools-${VERSION}-Blender-5.2-Linux-x86_64.zip"
          gh release create "v${VERSION}" _dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "HoTools-${VERSION}"
